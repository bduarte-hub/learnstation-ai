<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orquestrando o Futuro</title>
  <script>
    // Redirect to SPA shell, preserving the ?ep= slug
    const slug = new URLSearchParams(location.search).get('ep');
    if (slug) {
      location.replace('index.html?ep=' + encodeURIComponent(slug));
    } else {
      location.replace('index.html');
    }
  </script>
</head>
<body></body>
</html>
