<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedbacks — LearnStation.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1e2633;
      --border:   #2a3441;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --accent:   #3b82f6;
      --accent2:  #1d4ed8;
      --green:    #22c55e;
      --amber:    #f59e0b;
      --red:      #ef4444;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 15px; line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-logo { font-weight: 800; font-size: 1.1rem; }
    .header-logo .dot { color: var(--accent); }
    .header-badge {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent); font-size: .72rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .header-back {
      color: var(--muted); font-size: .875rem; text-decoration: none;
      display: flex; align-items: center; gap: 6px;
      transition: color .15s;
    }
    .header-back:hover { color: var(--text); }

    /* ── Empty / loading states ── */
    .state-container {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 16px;
      color: var(--muted); text-align: center; padding: 32px;
    }
    .state-icon { font-size: 3rem; }
    .state-title { font-size: 1.15rem; font-weight: 600; color: var(--text); }
    .state-desc { font-size: .875rem; max-width: 36ch; }

    /* ── Main layout ── */
    .main { max-width: 880px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ── Summary bar ── */
    .summary {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px 28px; margin-bottom: 32px;
      display: flex; gap: 32px; flex-wrap: wrap; align-items: center;
    }
    .summary-stat { display: flex; flex-direction: column; gap: 3px; }
    .summary-num { font-size: 2rem; font-weight: 800; line-height: 1; }
    .summary-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .summary-divider { width: 1px; height: 44px; background: var(--border); }
    .summary-actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px; border-radius: 8px; border: none;
      font-size: .875rem; font-weight: 600; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .btn-ghost {
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    /* ── Episode group ── */
    .ep-group { margin-bottom: 40px; }
    .ep-group-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .ep-group-title { font-weight: 700; font-size: 1rem; }
    .ep-group-count {
      background: var(--surface2); color: var(--muted);
      font-size: .72rem; font-weight: 700; letter-spacing: .05em;
      padding: 2px 8px; border-radius: 999px;
    }

    /* ── Comment card ── */
    .comment-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 0; margin-bottom: 12px;
      overflow: hidden; transition: border-color .15s;
    }
    .comment-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

    .comment-location {
      background: var(--surface2); border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .location-heading {
      font-size: .825rem; font-weight: 600; color: var(--text);
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .location-meta {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .location-pill {
      font-size: .7rem; font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
    }
    .pill-section { background: color-mix(in srgb, var(--amber) 12%, transparent); color: var(--amber); }
    .pill-scroll  { background: color-mix(in srgb, var(--green) 12%, transparent);  color: var(--green); }

    /* Scroll position bar */
    .scroll-track {
      height: 3px; background: var(--border); border-radius: 99px;
      width: 64px; position: relative; flex-shrink: 0;
    }
    .scroll-fill {
      position: absolute; left: 0; top: 0; height: 100%;
      background: var(--green); border-radius: 99px;
    }
    .scroll-label { font-size: .7rem; color: var(--muted); min-width: 28px; text-align: right; }

    .comment-body { padding: 16px 20px 14px; }
    .comment-text {
      font-size: .9375rem; line-height: 1.65; color: var(--text);
      white-space: pre-wrap;
    }
    .comment-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .comment-time { font-size: .72rem; color: var(--muted); }
    .comment-snippet {
      font-size: .72rem; color: var(--muted);
      max-width: 28ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-style: italic;
    }

    /* ── Snippet of clicked text ── */
    .snippet-label {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .7rem; color: var(--muted);
    }
    .snippet-label::before { content: '"'; }
    .snippet-label::after  { content: '"'; }

    /* ── Copy toast ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: #1e293b; color: #e2e8f0;
      padding: 10px 22px; border-radius: 999px;
      font-size: .825rem; font-weight: 600; letter-spacing: .02em;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Source badge when shared ── */
    .shared-banner {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 10px; padding: 14px 20px; margin-bottom: 28px;
      display: flex; align-items: center; gap: 12px;
      font-size: .875rem;
    }
    .shared-banner-icon { font-size: 1.2rem; }
    .shared-banner-text { color: var(--muted); }
    .shared-banner-text strong { color: var(--text); }

    @media (max-width: 600px) {
      .header { padding: 16px 20px; }
      .main { padding: 24px 16px 60px; }
      .summary { gap: 20px; padding: 20px; }
      .summary-divider { display: none; }
      .summary-actions { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <span class="header-logo">LearnStation<span class="dot">.AI</span></span>
    <span class="header-badge">Revisão de Feedback</span>
  </div>
  <a class="header-back" href="index.html">← Voltar ao site</a>
</header>

<div id="root"></div>

<div class="toast" id="toast"></div>

<script>
  const root  = document.getElementById('root');
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  /* ── Load comments: from hash (shared) or localStorage ── */
  function loadComments() {
    const hash = window.location.hash.slice(1);
    if (hash) {
      try {
        return { comments: JSON.parse(decodeURIComponent(escape(atob(hash)))), shared: true };
      } catch { /* fall through */ }
    }
    try {
      return { comments: JSON.parse(localStorage.getItem('learnstation_feedback') || '[]'), shared: false };
    } catch { return { comments: [], shared: false }; }
  }

  /* ── Render ── */
  function render() {
    const { comments, shared } = loadComments();

    if (!comments.length) {
      root.innerHTML = `
        <div class="state-container">
          <div class="state-icon">💬</div>
          <div class="state-title">Nenhum feedback ainda</div>
          <div class="state-desc">
            ${shared
              ? 'O link não contém comentários ou está inválido.'
              : 'Acesse um episódio e dê um duplo clique em qualquer parte para deixar um comentário.'}
          </div>
        </div>`;
      return;
    }

    /* Group by episode */
    const groups = {};
    comments.forEach(c => {
      const key = c.pageId || 'home';
      if (!groups[key]) groups[key] = [];
      groups[key].push(c);
    });

    const epLabels = {
      'home': 'Página inicial',
      'ai-basics': 'Ep.1 — AI Basics',
      'engenharia-de-prompt': 'Ep.2 — Engenharia de Prompt',
      'deep-learning-e-modelos-genai': 'Ep.3 — Deep Learning e Modelos de GenAI',
      'responsabilidade-social': 'Ep.4 — Responsabilidade Social',
    };

    /* Summary stats */
    const epCount = Object.keys(groups).length;

    let html = `<div class="main">`;

    if (shared) {
      html += `
        <div class="shared-banner">
          <span class="shared-banner-icon">🔗</span>
          <span class="shared-banner-text">
            <strong>Feedback compartilhado pelo Vic.</strong>
            Estes comentários foram exportados diretamente do browser dele.
          </span>
        </div>`;
    }

    html += `
      <div class="summary">
        <div class="summary-stat">
          <span class="summary-num">${comments.length}</span>
          <span class="summary-label">Comentários</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-stat">
          <span class="summary-num">${epCount}</span>
          <span class="summary-label">Episódios</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-stat">
          <span class="summary-num">${comments[comments.length-1]?.at?.split(' ')[0] || '—'}</span>
          <span class="summary-label">Primeiro feedback</span>
        </div>
        <div class="summary-actions">
          ${!shared ? `<button class="btn btn-primary" id="btn-share">🔗 Gerar link para compartilhar</button>` : ''}
          <button class="btn btn-ghost" id="btn-copy-all">📋 Copiar tudo</button>
        </div>
      </div>`;

    /* Cards grouped by episode */
    Object.entries(groups).forEach(([epKey, epComments]) => {
      const label = epLabels[epKey] || epKey;
      html += `
        <div class="ep-group">
          <div class="ep-group-header">
            <span class="ep-group-title">${label}</span>
            <span class="ep-group-count">${epComments.length} comentário${epComments.length !== 1 ? 's' : ''}</span>
          </div>`;

      epComments.forEach(c => {
        const loc  = c.location || {};
        const pct  = loc.scrollPct != null ? loc.scrollPct : null;
        const section = loc.sectionId || '';
        const snippet = loc.snippet || '';

        html += `
          <div class="comment-card">
            <div class="comment-location">
              <span class="location-heading" title="${c.context}">${c.context}</span>
              <div class="location-meta">
                ${section ? `<span class="location-pill pill-section">${section}</span>` : ''}
                ${pct != null ? `
                  <div class="scroll-track" title="${pct}% da página">
                    <div class="scroll-fill" style="width:${pct}%"></div>
                  </div>
                  <span class="scroll-label">${pct}%</span>` : ''}
              </div>
            </div>
            <div class="comment-body">
              <div class="comment-text">${escHtml(c.text)}</div>
              <div class="comment-footer">
                <span class="comment-time">🕐 ${c.at}</span>
                ${snippet ? `<span class="snippet-label">${escHtml(snippet.slice(0,50))}</span>` : ''}
              </div>
            </div>
          </div>`;
      });

      html += `</div>`;
    });

    html += `</div>`;
    root.innerHTML = html;

    /* Share button */
    const btnShare = document.getElementById('btn-share');
    if (btnShare) {
      btnShare.onclick = () => {
        const data = btoa(unescape(encodeURIComponent(JSON.stringify(comments))));
        const url  = window.location.origin + '/feedback.html#' + data;
        navigator.clipboard.writeText(url)
          .then(() => showToast('✓ Link copiado! Manda pro Bruno.'))
          .catch(() => prompt('Copie este link:', url));
      };
    }

    /* Copy all as text */
    const btnCopy = document.getElementById('btn-copy-all');
    if (btnCopy) {
      btnCopy.onclick = () => {
        const txt = comments.map((c, i) =>
          `[${i + 1}] ${epLabels[c.pageId] || c.pageId || 'home'}\nSeção: ${c.context}${c.location?.scrollPct != null ? ` (${c.location.scrollPct}% da página)` : ''}\n"${c.text}"\n${c.at}`
        ).join('\n\n---\n\n');
        navigator.clipboard.writeText(txt)
          .then(() => showToast('✓ Comentários copiados!'))
          .catch(() => {});
      };
    }
  }

  function escHtml(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
